[package]
name = "hoshikv_thermal"
version = "2.0.0"
edition = "2021"
description = "hoshikv-thermal: mi_thermald engine + IThermal AIDL HAL for Redmi Turbo 3 (peridot)"

[[bin]]
name = "hoshikv-thermal"
path = "src/main.rs"

[features]
default = []
debug-log = []

[dependencies]
rsbinder = { version = "0.10", default-features = false }
libc = "0.2"
aes = "0.8"
cbc = "0.1"

[build-dependencies]
rsbinder-aidl = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-debug]
inherits = "release"
debug = 2
strip = false
